spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:raisetimeline}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=always

mybatis.configuration.map-underscore-to-camel-case=true
mybatis.mapper-locations=classpath:mapper/*.xml

server.port=${SERVER_PORT:8080}

app.jwt.secret=${JWT_SECRET:dev-secret-key-change-in-production-must-be-32chars!}
app.jwt.expiration-ms=900000
app.jwt.refresh-expiration-ms=604800000

app.s3.bucket-name=${S3_BUCKET_NAME:raisetimeline-images-174516979085}
app.s3.region=${S3_REGION:ap-northeast-1}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
